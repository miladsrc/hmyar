name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Validate memory
        run: python scripts/validate_memory.py
      - name: Check links
        run: python scripts/check_links.py
      - name: Check secrets
        run: python scripts/check_secrets.py
      - name: Run tests
        run: python -m pytest -q